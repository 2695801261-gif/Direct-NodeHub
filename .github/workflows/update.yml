name: Refresh public node pool
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "direct_nodehub/**"
      - "config/**"
      - "requirements.txt"
      - "tests/**"
permissions:
  contents: write
concurrency:
  group: direct-nodehub-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned official Mihomo stable binary with API digest verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mihomo-meta
          import json, urllib.request
          version = "v1.19.34"
          asset_name = "mihomo-linux-amd64-compatible-" + version + ".gz"
          request = urllib.request.Request(
              "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/" + version,
              headers={"Accept": "application/vnd.github+json", "User-Agent": "Direct-NodeHub"}
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              release = json.load(response)
          asset = next((item for item in release["assets"] if item["name"] == asset_name), None)
          digest = str(asset.get("digest", "")) if asset else ""
          if not asset or not digest.startswith("sha256:"):
              raise SystemExit("Missing official SHA-256 digest; refusing unverified binary")
          print(asset["browser_download_url"])
          print(digest.split(":", 1)[1])
          PY
          URL="$(sed -n '1p' /tmp/mihomo-meta)"
          DIGEST="$(sed -n '2p' /tmp/mihomo-meta)"
          curl --fail --location --retry 3 --connect-timeout 15 "$URL" -o /tmp/mihomo.gz
          echo "$DIGEST  /tmp/mihomo.gz" | sha256sum --check -
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo -v
          echo "MIHOMO_BIN=/tmp/mihomo" >> "$GITHUB_ENV"
      - name: Run parser and module regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check cloudflare/worker-ws-relay.js
      - name: Collect public candidates
        run: python -m direct_nodehub
      - name: Run cloud TCP reachability probes
        run: python -m direct_nodehub.probe
      - name: Verify real Mihomo tunnels and exit IPs
        run: python -m direct_nodehub.protocol
      - name: Check public exit-IP threat feeds
        run: python -m direct_nodehub.risk
      - name: Repeat tunnel and download stability tests
        run: python -m direct_nodehub.stability
      - name: Generate cloud-verified subscriptions and chain template
        run: python -m direct_nodehub.publish
      - name: Validate generated Mihomo configurations
        run: |
          set -euo pipefail
          for config in public/clash.yaml public/fast.yaml public/chain-template.yaml; do
            echo "Validating $config"
            /tmp/mihomo -t -f "$config"
          done
      - name: Commit generated public data without racing newer commits
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain public)" ]; then
            echo "No public output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "chore: refresh verified node data"
          git fetch origin main
          # Generated public files from this run are authoritative; when a prior
          # refresh changed the same files, keep this run's newly generated data.
          git rebase -X theirs origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Public data committed successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; fetching and rebasing latest main."
            git fetch origin main
            git rebase -X theirs origin/main
            sleep $((attempt * 3))
          done
          echo "Could not push generated data after 3 attempts."
          exit 1
