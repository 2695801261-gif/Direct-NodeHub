name: Refresh public node pool

on:
  workflow_dispatch:

# The automatic schedule will be enabled after the end-to-end collector,
# risk checks, and Mihomo output validator are implemented and tested.
permissions:
  contents: write

concurrency:
  group: direct-nodehub-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run parser regression tests
        run: python -m unittest discover -s tests -v
      - name: Refresh node pool
        run: python -m direct_nodehub
      - name: Run cloud TCP reachability probes
        run: python -m direct_nodehub.probe
      - name: Commit generated public data
        run: |
          if [ -n "$(git status --porcelain public)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "chore: refresh public node data"
            git push
          else
            echo "No public output changes."
          fi
