name: Refresh public node pool
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: direct-nodehub-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned official Mihomo stable binary with API digest verification
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v1.19.34"
          ASSET="mihomo-linux-amd64-compatible-"$VERSION".gz"
          readarray -t META < <(python - <<'PY'
          import json, urllib.request
          v="v1.19.34"; name="mihomo-linux-amd64-compatible-"+v+".gz"
          req=urllib.request.Request("https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/"+v,headers={"Accept":"application/vnd.github+json","User-Agent":"Direct-NodeHub"})
          with urllib.request.urlopen(req,timeout=20) as r: d=json.load(r)
          a=next((x for x in d["assets"] if x["name"]==name),None)
          if not a or not str(a.get("digest","")).startswith("sha256:"): raise SystemExit("missing SHA-256 digest")
          print(a["browser_download_url"]); print(a["digest"].split(":",1)[1])
          PY
          )
          curl --fail --location --retry 3 --connect-timeout 15 "\${META[0]}" -o /tmp/mihomo.gz
          echo "\${META[1]}  /tmp/mihomo.gz" | sha256sum --check -
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo -v
          echo "MIHOMO_BIN=/tmp/mihomo" >> "$GITHUB_ENV"
      - name: Run parser and module regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect public candidates
        run: python -m direct_nodehub
      - name: Run cloud TCP reachability probes
        run: python -m direct_nodehub.probe
      - name: Verify real Mihomo tunnels and exit IPs
        run: python -m direct_nodehub.protocol
      - name: Check public exit-IP threat feeds
        run: python -m direct_nodehub.risk
      - name: Commit generated public data
        run: |
          if [ -n "$(git status --porcelain public)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "chore: refresh verified node data"
            git push
          else
            echo "No public output changes."
          fi
