name: Run project regression tests
on:
  push:
    branches: [main]
    paths:
      - "direct_nodehub/**"
      - "tests/**"
      - "tools/**"
      - "cloudflare/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "direct_nodehub/**"
      - "tests/**"
      - "tools/**"
      - "cloudflare/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q direct_nodehub tools tests
      - name: Check Cloudflare Worker syntax
        run: |
          node --check cloudflare/worker-ws-relay.js
          node --check cloudflare/worker-ws-tcp-bridge.js

  windows-script-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate mainland probe PowerShell syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content tools/run-mainland-probe.ps1 -Raw))
          Write-Host "PowerShell syntax OK"
