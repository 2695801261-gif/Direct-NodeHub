mixed-port: 7891
allow-lan: false
mode: rule
log-level: warning
ipv6: false
proxies: []
proxy-groups:
- name: 高速手动选择
  type: select
  proxies:
  - DIRECT
- name: 高速自动优选
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 80
  lazy: true
  proxies:
  - DIRECT
- name: PROXY
  type: select
  proxies:
  - 高速自动优选
  - 高速手动选择
  - DIRECT
rules:
- MATCH,PROXY
